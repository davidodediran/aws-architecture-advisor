AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Architecture Advisor - Serverless Backend

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:3000'
    Description: Allowed origin for CORS headers

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        PROJECTS_TABLE: !Ref ProjectsTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        ARCHITECTURES_TABLE: !Ref ArchitecturesTable
        ARCHITECTURE_VERSIONS_TABLE: !Ref ArchitectureVersionsTable
        USER_QUOTA_TABLE: !Ref UserQuotaTable
        DEPLOYMENTS_TABLE: !Ref DeploymentsTable
        PRICING_CACHE_TABLE: !Ref PricingCacheTable
        TEMPLATES_BUCKET: !Ref TemplatesBucket
        CONNECTIONS_TABLE: !Ref ConnectionsTable

Resources:
  # ============================================================
  # REST API Gateway
  # ============================================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'aws-arch-advisor-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # ============================================================
  # WebSocket API Gateway
  # ============================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'aws-arch-advisor-ws-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$connect'
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizerId
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: '$disconnect'
      Target: !Sub 'integrations/${WebSocketDefaultIntegration}'

  WebSocketSendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: 'sendMessage'
      Target: !Sub 'integrations/${WebSocketDefaultIntegration}'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AiFunction.Arn}/invocations'

  WebSocketDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AiFunction.Arn}/invocations'

  WebSocketAuthorizerId:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      AuthorizerType: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthFunction.Arn}/invocations'
      Name: WebSocketAuthorizer
      IdentitySource:
        - 'route.request.querystring.token'

  AiFunctionWebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  AuthFunctionWebSocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # ============================================================
  # Lambda Functions
  # ============================================================
  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-projects-${Environment}'
      Handler: src/functions/projects/handler.handler
      Events:
        CreateProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects
            Method: POST
        ListProjects:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects
            Method: GET
        GetProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}
            Method: GET
        UpdateProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}
            Method: PUT
        DeleteProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable

  ConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-conversations-${Environment}'
      Handler: src/functions/conversations/handler.handler
      Timeout: 90
      MemorySize: 512
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/conversations
            Method: POST
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/conversations
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitecturesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  ArchitecturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-architectures-${Environment}'
      Handler: src/functions/architectures/handler.handler
      Timeout: 60
      Events:
        GetArchitecture:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture
            Method: GET
        GenerateCfn:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/cfn
            Method: POST
        WaReview:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/review
            Method: POST
        CostEstimate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/cost
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitecturesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - S3CrudPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:ValidateTemplate
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'
        - DynamoDBReadPolicy:
            TableName: !Ref PricingCacheTable
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  DeploymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-deployments-${Environment}'
      Handler: src/functions/deployments/handler.handler
      Timeout: 60
      Events:
        RequestDeployment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy
            Method: POST
        GetDeploymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy/status
            Method: GET
        DeleteDeployment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PricingCacheTable
        - S3ReadPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:CreateStack
                - cloudformation:DeleteStack
                - cloudformation:DescribeStacks
                - cloudformation:DescribeStackEvents
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-ai-${Environment}'
      Handler: src/functions/ai/handler.handler
      Timeout: 90
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-validation-${Environment}'
      Handler: src/functions/validation/handler.handler
      Events:
        ValidateCfn:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /validate/cfn
            Method: POST
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /upload-url
            Method: POST
        ExportProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /export/{projectId}
            Method: GET
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TemplatesBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:ValidateTemplate
              Resource: '*'

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-auth-${Environment}'
      Handler: src/functions/auth/handler.authorizer
      Events:
        TrainerUnlock:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/trainer-unlock
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-projects-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-conversations-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'arch-advisor-connections-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ArchitecturesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-architectures-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArchitectureVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-arch-versions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserQuotaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-user-quota-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-deployments-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PricingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'arch-advisor-pricing-cache-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ============================================================
  # S3 Buckets
  # ============================================================
  TemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-templates-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-frontend-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # ============================================================
  # Cognito
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'arch-advisor-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'arch-advisor-web-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  TrainersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: trainers
      UserPoolId: !Ref CognitoUserPool
      Description: Trainers who can unlock student accounts and manage cohorts

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  WebSocketUrl:
    Description: WebSocket API endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
  TemplatesBucketName:
    Description: S3 bucket for CloudFormation templates
    Value: !Ref TemplatesBucket
  FrontendBucketName:
    Description: S3 bucket for frontend static hosting
    Value: !Ref FrontendBucket
