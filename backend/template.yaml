AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Architecture Advisor - Serverless Backend

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECTS_TABLE: !Ref ProjectsTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        ARCHITECTURE_VERSIONS_TABLE: !Ref ArchitectureVersionsTable
        DEPLOYMENTS_TABLE: !Ref DeploymentsTable
        AUDIT_LOG_TABLE: !Ref AuditLogTable
        USER_QUOTA_TABLE: !Ref UserQuotaTable
        PRICE_CACHE_TABLE: !Ref PriceCacheTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        TEMPLATES_BUCKET: !Ref TemplatesBucket
        ALLOWED_ORIGIN: !Sub 'https://${CloudFrontDomain}'

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CloudFrontDomain:
    Type: String
    Default: localhost:3000
    Description: CloudFront distribution domain for CORS

Resources:
  # --- API Gateway ---
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'aws-arch-advisor-${Stage}'
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'https://${CloudFrontDomain}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # --- Lambda Functions ---
  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-projects-${Stage}'
      Handler: dist/functions/projects/handler.handler
      Events:
        CreateProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects
            Method: POST
        ListProjects:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects
            Method: GET
        GetProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}
            Method: GET
        DeleteProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTable

  ConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-conversations-${Stage}'
      Handler: dist/functions/conversations/handler.handler
      Timeout: 60
      MemorySize: 512
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/conversations
            Method: POST
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/conversations/{projectId}
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  ArchitecturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-architectures-${Stage}'
      Handler: dist/functions/architectures/handler.handler
      Timeout: 60
      Events:
        GetArchitecture:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}/architecture
            Method: GET
        GenerateCfn:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}/generate-cfn
            Method: POST
        ValidateArchitecture:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}/validate
            Method: POST
        WaReview:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/projects/{projectId}/wa-review
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - S3CrudPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:ValidateTemplate
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  DeploymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-deployments-${Stage}'
      Handler: dist/functions/deployments/handler.handler
      Timeout: 60
      Events:
        RequestDeployment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/deployments
            Method: POST
        GetDeploymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/deployments/{deploymentId}
            Method: GET
        DeleteStack:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/deployments/{deploymentId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PriceCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTable
        - S3ReadPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-ai-${Stage}'
      Handler: dist/functions/ai/handler.handler
      Events:
        ListTemplates:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/templates
            Method: GET
        CostEstimate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/cost-estimate
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PriceCacheTable
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aws-arch-advisor-validation-${Stage}'
      Handler: dist/functions/validation/handler.handler
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/upload-url
            Method: POST
        ExportPortfolio:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /api/export-portfolio
            Method: GET
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTable

  # --- DynamoDB Tables ---
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-projects-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-conversations-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArchitectureVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-architecture-versions-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-deployments-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-audit-log-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  UserQuotaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-user-quota-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  PriceCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'aws-arch-advisor-price-cache-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # --- S3 Buckets ---
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-arch-advisor-uploads-${Stage}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins:
              - !Sub 'https://${CloudFrontDomain}'
            MaxAge: 300

  TemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-arch-advisor-templates-${Stage}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # --- Cognito ---
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'aws-arch-advisor-${Stage}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'aws-arch-advisor-web-${Stage}'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  TrainersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: trainers
      UserPoolId: !Ref CognitoUserPool
      Description: Trainers who can unlock student accounts and manage cohorts

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
