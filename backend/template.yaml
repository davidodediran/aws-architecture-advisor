AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Architecture Advisor - Serverless Backend

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  AllowedOrigin:
    Type: String
    Default: 'http://localhost:3000'
    Description: Allowed origin for CORS headers

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        PROJECTS_TABLE: !Ref ProjectsTable
        CONVERSATIONS_TABLE: !Ref ConversationsTable
        ARCHITECTURES_TABLE: !Ref ArchitecturesTable
        ARCHITECTURE_VERSIONS_TABLE: !Ref ArchitectureVersionsTable
        USER_QUOTA_TABLE: !Ref UserQuotaTable
        DEPLOYMENTS_TABLE: !Ref DeploymentsTable
        PRICING_CACHE_TABLE: !Ref PricingCacheTable
        TEMPLATES_BUCKET: !Ref TemplatesBucket

Resources:
  # ============================================================
  # API Gateway
  # ============================================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'aws-arch-advisor-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # ============================================================
  # Lambda Functions
  # ============================================================
  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-projects-${Environment}'
      Handler: src/functions/projects/handler.handler
      Events:
        CreateProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects
            Method: POST
        ListProjects:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects
            Method: GET
        GetProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}
            Method: GET
        DeleteProject:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable

  ConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-conversations-${Environment}'
      Handler: src/functions/conversations/handler.handler
      Timeout: 90
      MemorySize: 512
      Events:
        SendMessage:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /conversations/{projectId}/messages
            Method: POST
        GetConversation:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /conversations/{projectId}
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitecturesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  ArchitecturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-architectures-${Environment}'
      Handler: src/functions/architectures/handler.handler
      Timeout: 60
      Events:
        GetArchitecture:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture
            Method: GET
        GenerateCfn:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/generate-cfn
            Method: POST
        ValidateArchitecture:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/validate
            Method: POST
        WaReview:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/architecture/wa-review
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitecturesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - S3CrudPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:ValidateTemplate
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: '*'

  DeploymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-deployments-${Environment}'
      Handler: src/functions/deployments/handler.handler
      Timeout: 60
      Events:
        RequestDeployment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy
            Method: POST
        GetDeploymentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy/status
            Method: GET
        DeleteDeployment:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /projects/{projectId}/deploy
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeploymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchitectureVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PricingCacheTable
        - S3ReadPolicy:
            BucketName: !Ref TemplatesBucket
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - cloudformation:CreateStack
                - cloudformation:DeleteStack
                - cloudformation:DescribeStacks
                - cloudformation:DescribeStackEvents
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-ai-${Environment}'
      Handler: src/functions/ai/handler.handler
      Events:
        ListTemplates:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /ai/templates
            Method: GET
        CostEstimate:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /ai/cost-estimate
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PricingCacheTable
        - Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
              Resource: '*'

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-validation-${Environment}'
      Handler: src/functions/validation/handler.handler
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /validation/upload-url
            Method: POST
        ExportPortfolio:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /validation/export-portfolio
            Method: GET
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TemplatesBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'arch-advisor-auth-${Environment}'
      Handler: src/functions/auth/handler.authorizer
      Events:
        TrainerUnlock:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/trainer-unlock
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserQuotaTable

  # ============================================================
  # DynamoDB Tables
  # ============================================================
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-projects-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-conversations-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArchitecturesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-architectures-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArchitectureVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-arch-versions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserQuotaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-user-quota-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub 'arch-advisor-deployments-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PricingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'arch-advisor-pricing-cache-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ============================================================
  # S3 Buckets
  # ============================================================
  TemplatesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-templates-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-frontend-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # ============================================================
  # Cognito
  # ============================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'arch-advisor-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'arch-advisor-web-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  TrainersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: trainers
      UserPoolId: !Ref CognitoUserPool
      Description: Trainers who can unlock student accounts and manage cohorts

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
  TemplatesBucketName:
    Description: S3 bucket for CloudFormation templates
    Value: !Ref TemplatesBucket
  FrontendBucketName:
    Description: S3 bucket for frontend static hosting
    Value: !Ref FrontendBucket
