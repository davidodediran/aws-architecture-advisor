AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Architecture Advisor - S3 Buckets and IAM Roles for Bedrock Knowledge Base

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  WaDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-wa-docs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: aws-architecture-advisor

  VectorStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'arch-advisor-vector-store-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: aws-architecture-advisor

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'arch-advisor-kb-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KnowledgeBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3ReadDocs
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt WaDocsBucket.Arn
                  - !Sub '${WaDocsBucket.Arn}/*'
              - Sid: S3ReadWriteVectorStore
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt VectorStoreBucket.Arn
                  - !Sub '${VectorStoreBucket.Arn}/*'
              - Sid: InvokeEmbeddingModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
              - Sid: S3VectorsAccess
                Effect: Allow
                Action:
                  - s3vectors:*
                Resource:
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/arch-advisor-vectors-*'
                  - !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/arch-advisor-vectors-*/index/*'

  LambdaReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'arch-advisor-kb-reader-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockKBReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'

Outputs:
  WaDocsBucketName:
    Value: !Ref WaDocsBucket
    Description: S3 bucket for WA Framework source documents
  WaDocsBucketArn:
    Value: !GetAtt WaDocsBucket.Arn
    Description: ARN of the WA Framework source documents bucket
  VectorStoreBucketName:
    Value: !Ref VectorStoreBucket
    Description: S3 bucket for vector store indexes
  VectorStoreBucketArn:
    Value: !GetAtt VectorStoreBucket.Arn
    Description: ARN of the vector store bucket
  KnowledgeBaseRoleArn:
    Value: !GetAtt KnowledgeBaseRole.Arn
    Description: IAM role ARN for the Bedrock Knowledge Base
  LambdaReadRoleArn:
    Value: !GetAtt LambdaReadRole.Arn
    Description: IAM role ARN for Lambda to query the Knowledge Base
